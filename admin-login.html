<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Baluch Martyrs Memorial</title>
    <meta name="description" content="Admin login for Baluch Martyrs Memorial">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any">
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        :root {
            --login-primary: #1a3d20;
            --login-primary-light: #2c5530;
            --login-accent: #10b981;
        }

        body {
            background:
                radial-gradient(circle at 20% 20%, rgba(44, 85, 48, 0.35), transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.18), transparent 45%),
                linear-gradient(145deg, #0b1911 0%, #132a19 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            padding: 2.5rem 2.25rem;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        .login-badge-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-light) 100%);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.15rem;
            box-shadow: 0 8px 20px rgba(26, 61, 32, 0.28);
        }

        .login-badge-icon svg {
            width: 26px;
            height: 26px;
        }

        .login-header {
            margin-bottom: 1.75rem;
        }

        .login-header h1 {
            color: #0f172a;
            margin: 0 0 0.4rem 0;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 0;
            line-height: 1.45;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: #334155;
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            padding: 0 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 11px;
            font-size: 0.95rem;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper input[type="password"],
        .input-wrapper input.password-field {
            padding-right: 2.75rem;
        }

        .form-group input:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--login-primary-light);
            box-shadow: 0 0 0 3.5px rgba(44, 85, 48, 0.14);
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.65rem;
            background: none;
            border: none;
            color: #64748b;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .password-toggle-btn:hover {
            color: #0f172a;
            background: #e2e8f0;
        }

        .password-toggle-btn svg {
            width: 18px;
            height: 18px;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            padding: 0 1.25rem;
            background: linear-gradient(135deg, var(--login-primary) 0%, var(--login-primary-light) 100%);
            color: white;
            border: none;
            border-radius: 11px;
            font-size: 0.96rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
            margin-top: 0.25rem;
            margin-bottom: 1.15rem;
            box-shadow: 0 4px 14px rgba(26, 61, 32, 0.28);
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 61, 32, 0.36);
        }

        .login-btn:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .error-message {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: none;
        }

        .back-link {
            color: #475569;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            border-radius: 8px;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .back-link:hover {
            color: var(--login-primary);
            background: #f1f5f9;
        }

        .security-note {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 0.75rem 0.9rem;
            border-radius: 10px;
            font-size: 0.78rem;
            line-height: 1.45;
            margin-top: 1.25rem;
            text-align: left;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .security-note svg {
            width: 16px;
            height: 16px;
            color: var(--login-primary-light);
            flex-shrink: 0;
            margin-top: 1px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-badge-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>

        <div class="login-header">
            <h1>Admin Moderation</h1>
            <p>Sign in to review and manage Baluch Martyrs Memorial submissions</p>
        </div>

        <div id="errorMessage" class="error-message" role="alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" name="username" required autocomplete="username" value="admin">
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="password-field" name="password" required autocomplete="current-password" placeholder="Enter admin password">
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Show password" title="Show/Hide Password">
                        <svg id="eyeIconOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                Login to Admin Panel
            </button>
        </form>

        <a href="/" class="back-link">
            ← Back to Memorial Website
        </a>

        <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <div><strong>Protected Access:</strong> Server-side authentication with encrypted session credentials and rate limiting.</div>
        </div>
    </div>

    <script>
        (function() {
            const toggleBtn = document.getElementById('togglePasswordBtn');
            const pwdInput = document.getElementById('password');
            if (toggleBtn && pwdInput) {
                toggleBtn.addEventListener('click', function() {
                    const isPwd = pwdInput.type === 'password';
                    pwdInput.type = isPwd ? 'text' : 'password';
                    toggleBtn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
                    toggleBtn.innerHTML = isPwd
                        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
                        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
                });
            }
        })();
    </script>

    <script type="module">
        import { adminAuth } from './js/auth.js';
        import { checkRateLimit, logSecurityEvent } from './js/security.js';

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.background = '#f8d7da';
            errorDiv.style.color = '#721c24';
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.background = '#d4edda';
            errorDiv.style.color = '#155724';
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 2000);
        }

        // Check if already logged in
        function checkExistingSession() {
            console.log('🔍 Checking for existing admin session...');
            
            if (adminAuth.isAuthenticated()) {
                console.log('✅ Valid session found, redirecting to admin panel');
                const admin = adminAuth.getCurrentAdmin();
                console.log(`Session for: ${admin.username}, expires: ${admin.expires.toLocaleString()}`);
                window.location.href = '/admin';
                return true;
            }
            
            console.log('❌ No valid session found');
            return false;
        }

        // Server-side authentication (secure)
        async function authenticateWithServer(username, password) {
            try {
                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    return result;
                }
                
                return { success: false, error: result.error || 'Authentication failed' };
            } catch (error) {
                console.error('Server auth error:', error);
                return { success: false, error: 'Server unavailable. Please try again.' };
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            console.log(`🔐 Login attempt for username: ${username}`);
            
            // Rate limiting check (max 5 attempts per 5 minutes)
            const rateCheck = checkRateLimit('admin_login', 5, 300000);
            if (!rateCheck.allowed) {
                logSecurityEvent('rate_limit_exceeded', { action: 'admin_login', username });
                showError(`Too many login attempts. Please wait ${rateCheck.waitSeconds} seconds.`);
                return;
            }
            
            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';

            try {
                // Server-side authentication only (secure)
                const serverResult = await authenticateWithServer(username, password);
                
                if (serverResult.success) {
                    console.log(`✅ Authentication successful for: ${username}`);
                    logSecurityEvent('login_success', { username });
                    
                    // Store JWT token securely
                    if (serverResult.token) {
                        sessionStorage.setItem('adminToken', serverResult.token);
                        localStorage.setItem('adminTokenExpiry', Date.now() + serverResult.expiresIn);
                    }
                    
                    // Create session using auth.js
                    const sessionData = adminAuth.createSession(username);
                    
                    if (sessionData) {
                        showSuccess('Login successful! Redirecting...');
                        setTimeout(() => {
                            window.location.href = '/admin';
                        }, 1000);
                    } else {
                        showError('Session creation failed. Please try again.');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login to Admin Panel';
                    }
                } else {
                    logSecurityEvent('login_failure', { username, reason: serverResult.error });
                    showError(serverResult.error || 'Invalid username or password.');
                    document.getElementById('password').value = '';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login to Admin Panel';
                }
            } catch (error) {
                console.error('❌ Login process error:', error);
                logSecurityEvent('login_error', { username, error: error.message });
                showError('An error occurred during login. Please try again.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to Admin Panel';
            }
        });

        // Check for existing session on page load
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Admin login page loaded');
            checkExistingSession();
            
            // Auto-focus password field (username is pre-filled)
            document.getElementById('password').focus();
        });
        
        // Also run immediately if DOM already loaded
        if (document.readyState !== 'loading') {
            console.log('🚀 Admin login page already loaded');
            checkExistingSession();
        }
    </script>
</body>
</html>
